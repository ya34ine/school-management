<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Users</title>
</head>

<body>

<h1>Users</h1>

<table border="1">

    <thead>
    <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Role</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>

    <tr th:each="user : ${users}">

        <td th:text="${user.id}"></td>

        <td th:text="${user.username}"></td>

        <td th:text="${user.role}"></td>

         <td>
        <a th:href="@{/users/{id}/edit(id=${user.id})}">
            Edit
        </a>
    </td>


    </tr>

    </tbody>

</table>

<br>

<a href="/users/new">Create User</a>

</body>
</html>
