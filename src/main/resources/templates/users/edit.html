<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Edit User</title>
</head>

<body>

<h1>Edit User</h1>

<form th:action="@{/users/{id}(id=${user.id})}" method="post">

    <label>Username:</label>
    <input type="text"
           name="username"
           th:value="${user.username}">
    <br><br>

    <label>Role:</label>

    <select name="role">

        <option value="DIRECTOR"
                th:selected="${user.role.name() == 'DIRECTOR'}">
            DIRECTOR
        </option>

        <option value="TEACHER"
                th:selected="${user.role.name() == 'TEACHER'}">
            TEACHER
        </option>

        <option value="STAFF"
                th:selected="${user.role.name() == 'STAFF'}">
            STAFF
        </option>

    </select>

    <br><br>

    <button type="submit">Save</button>

</form>

<br>

<a href="/users">Back to users</a>

</body>
</html>
