<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create User</title>
</head>
<body>

<h1>Create User</h1>

<form action="/users" method="post">


    <input type="hidden"
       th:name="${_csrf.parameterName}"
       th:value="${_csrf.token}">
       
    <div>
        <label for="username">Username:</label>
        <input
                type="text"
                id="username"
                name="username"
                required>
    </div>

    <br>

    <div>
        <label for="password">Password:</label>
        <input
                type="password"
                id="password"
                name="password"
                required>
    </div>

    <br>

    <div>
        <label for="role">Role:</label>

        <select id="role" name="role">

            <option value="DIRECTOR">
                Director
            </option>

            <option value="TEACHER">
                Teacher
            </option>

            <option value="EMPLOYEE">
                Employee
            </option>

        </select>
    </div>

    <br>

    <button type="submit">
        Create User
    </button>

</form>

</body>
</html>
